version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: campus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_market_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - campus_postgres_data:/var/lib/postgresql/data
    networks:
      - dbnet

  adminer:
    image: adminer
    container_name: campus-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - public
      - dbnet

  kong:
    image: kong:3
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong.yml:/opt/kong/kong.yml:ro
    networks:
      - public
      - auth-net
      - listing-net
      - message-net

  auth-service:
    build:
      context: ../auth_service
      dockerfile: Dockerfile
      args:
          GITLAB_MAVEN_USER: ${GITLAB_MAVEN_USER}
          GITLAB_MAVEN_TOKEN: ${GITLAB_MAVEN_TOKEN}
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_market_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    networks:
      - auth-net
      - dbnet

  listing-service:
    build:
      context: ../listing_service
      dockerfile: Dockerfile
      args:
          GITLAB_MAVEN_USER: ${GITLAB_MAVEN_USER}
          GITLAB_MAVEN_TOKEN: ${GITLAB_MAVEN_TOKEN}
    container_name: listing-service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_market_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8082:8080"
    networks:
      - listing-net
      - dbnet

  message-service:
    build:
      context: ../message_service
      dockerfile: Dockerfile
      args:
          GITLAB_MAVEN_USER: ${GITLAB_MAVEN_USER}
          GITLAB_MAVEN_TOKEN: ${GITLAB_MAVEN_TOKEN}
    container_name: message-service
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_market_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8083:8080"
    networks:
      - message-net
      - dbnet

volumes:
  campus_postgres_data:
 
networks:
  public:
    driver: bridge
  auth-net:
    driver: bridge
  listing-net:
    driver: bridge
  message-net:
    driver: bridge
  dbnet:
    driver: bridge