version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: campus_market_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - campus_postgres_data:/var/lib/postgresql/data
    networks:
      - dbnet
    deploy:
      replicas: 1
      labels:
        - "project=campus-market"
        - "component=database"
        - "deployment=swarm"
      restart_policy:
        condition: on-failure

  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - public
      - dbnet
    depends_on:
      - postgres
    deploy:
      replicas: 1
      labels:
        - "project=campus-market"
        - "component=db-admin"
        - "deployment=swarm"
      restart_policy:
        condition: on-failure

  auth-service:
    image: registry.gitlab.com/proiect_idp2/auth_service:latest
    environment:
      JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt_private_key
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_market_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    secrets:
    - jwt_private_key
    networks:
      - auth-net
      - dbnet
    depends_on:
      - postgres
    deploy:
      replicas: 1
      labels:
        - "project=campus-market"
        - "component=auth"
        - "deployment=swarm"
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s

  listing-service:
    image: registry.gitlab.com/proiect_idp2/listing_service:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_market_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - listing-net
      - dbnet
    depends_on:
      - postgres
    deploy:
      replicas: 1
      labels:
        - "project=campus-market"
        - "component=business-logic"
        - "deployment=swarm"
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s

  message-service:
    image: registry.gitlab.com/proiect_idp2/message_service:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/campus_market_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    networks:
      - message-net
      - dbnet
    depends_on:
      - postgres
    deploy:
      replicas: 1
      labels:
        - "project=campus-market"
        - "component=messaging"
        - "deployment=swarm"
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        parallelism: 1
        delay: 10s

  kong:
    image: kong:3
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./kong.yml:/opt/kong/kong.yml:ro
    networks:
      - public
      - auth-net
      - listing-net
      - message-net
    depends_on:
      - auth-service
    deploy:
      replicas: 1
      labels:
        - "project=campus-market"
        - "component=api-gateway"
        - "deployment=swarm"
      restart_policy:
        condition: on-failure

  portainer:
    image: portainer/portainer-ce:latest
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - public
    deploy:
      replicas: 1
      labels:
        - "project=campus-market"
        - "component=cluster-management"
        - "deployment=swarm"
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - monitoring
      - auth-net
      - listing-net
      - message-net
    deploy:
      replicas: 1
      labels:
        - "project=campus-market"
        - "component=monitoring"
        - "deployment=swarm"
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  grafana:
    image: grafana/grafana:10.1.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring
      - public
    deploy:
      replicas: 1
      labels:
        - "project=campus-market"
        - "component=observability-dashboard"
        - "deployment=swarm"
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

volumes:
  campus_postgres_data:
  portainer_data:
  grafana_data:

networks:
  public:
    driver: overlay
  auth-net:
    driver: overlay
  listing-net:
    driver: overlay
  message-net:
    driver: overlay
  dbnet:
    driver: overlay
  monitoring:
    driver: overlay

secrets:
  jwt_private_key:
    external: true