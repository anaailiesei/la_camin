global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8080']
      
  - job_name: 'listing'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['listing-service:8080']

  - job_name: 'message'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['message-service:8080']

